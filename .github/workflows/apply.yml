name: apply

on:
  push:
    branches: [main]
    paths:
      - 'dashboards/**'
      - 'alerts/**'
      - 'environments/**'
      - 'scripts/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch:

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  dev:
    if: vars.GRAFANA_ENABLED == 'true' && vars.GRAFANA_URL_DEV != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL_DEV }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN_DEV }}
    steps:
      - uses: actions/checkout@v4

      - name: verificar secrets
        id: gate
        run: |
          if [ -z "$GRAFANA_TOKEN" ]; then
            echo "GRAFANA_TOKEN_DEV ausente: dev ignorado"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: apply em dev (canário)
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/apply.sh dev

      - name: drift em dev
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/drift.sh dev

  prod:
    needs: dev
    if: >-
      always() && vars.GRAFANA_ENABLED == 'true' && vars.GRAFANA_URL_PROD != '' &&
      (needs.dev.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GRAFANA_URL: ${{ vars.GRAFANA_URL_PROD }}
      DS_PROMETHEUS: ${{ vars.GRAFANA_DS_PROMETHEUS_PROD }}
      DS_LOKI: ${{ vars.GRAFANA_DS_LOKI_PROD }}
      DS_TEMPO: ${{ vars.GRAFANA_DS_TEMPO_PROD }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN_PROD }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: verificar secrets
        id: gate
        run: |
          if [ -z "$GRAFANA_TOKEN" ] || [ -z "$DS_PROMETHEUS" ] || [ -z "$DS_LOKI" ] || [ -z "$DS_TEMPO" ]; then
            echo "secrets ou variáveis de prod ausentes: prod ignorado"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: apply em prod
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/apply.sh prod

      - name: drift em prod
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/drift.sh prod
