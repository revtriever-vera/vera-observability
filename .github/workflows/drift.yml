name: drift

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  drift:
    if: vars.GRAFANA_ENABLED == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      GRAFANA_URL: ${{ matrix.environment == 'prod' && vars.GRAFANA_URL_PROD || vars.GRAFANA_URL_DEV }}
      DS_PROMETHEUS: ${{ matrix.environment == 'prod' && vars.GRAFANA_DS_PROMETHEUS_PROD || '' }}
      DS_LOKI: ${{ matrix.environment == 'prod' && vars.GRAFANA_DS_LOKI_PROD || '' }}
      DS_TEMPO: ${{ matrix.environment == 'prod' && vars.GRAFANA_DS_TEMPO_PROD || '' }}
      GRAFANA_TOKEN: ${{ matrix.environment == 'prod' && secrets.GRAFANA_TOKEN_PROD || secrets.GRAFANA_TOKEN_DEV }}
      CF_ACCESS_CLIENT_ID: ${{ matrix.environment == 'prod' && secrets.CF_ACCESS_CLIENT_ID || '' }}
      CF_ACCESS_CLIENT_SECRET: ${{ matrix.environment == 'prod' && secrets.CF_ACCESS_CLIENT_SECRET || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: verificar secrets
        id: gate
        run: |
          if [ -z "$GRAFANA_URL" ] || [ -z "$GRAFANA_TOKEN" ]; then
            echo "URL ou token de ${{ matrix.environment }} ausentes: ignorado"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: drift check (${{ matrix.environment }})
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/drift.sh ${{ matrix.environment }}
